# Robolectric runtime SDK. Pinned because the module's targetSdk (37) has no
# Robolectric android-all image yet; 36 (Android 16) is the newest Robolectric
# 4.16 ships and is closest to compileSdk/targetSdk. Bump when 37 is published.
sdk=36

# Use the stock Application rather than the sample's PrefsHelperApp. Robolectric instantiates the
# manifest's Application for every test, which would call startKoin() repeatedly and fail with
# KoinAppAlreadyStartedException once the JVM is reused. No test touches the sample's DI graph —
# they all declare their own helper subclasses — so there is nothing to lose by skipping it.
application=android.app.Application
